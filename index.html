<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("closer-theme")||"light";}catch(e){document.documentElement.dataset.theme="light";}</script>
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Closer</title>
<meta name="description" content="Closer : agenda, tâches, devoirs, habitudes et objectifs dans une seule page, sans compte ni serveur.">
<meta name="theme-color" id="theme-color" content="#eff0f2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Closer">
<link rel="preload" href="fonts/schibsted-grotesk.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/closer.css">
</head>
<body>
<div class="edge-top" aria-hidden="true"></div><div class="edge-bottom" aria-hidden="true"></div>
<div class="app" id="app">
  <div id="top" style="display:flex;justify-content:space-between;align-items:center;gap:12px">
    <div class="brand">Closer</div>
    <button type="button" class="btn ghost gear" data-act="ac-open" id="ac-btn" aria-label="Réglages"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><i class="acdot" id="ac-dot"></i></button>
  </div>
  <div class="note" id="note" hidden></div>

  <main id="v-jour" class="view">
    <div class="hero" id="hero"></div>
    <div class="week" id="week" role="group" aria-label="Les 7 prochains jours"></div>
    <div id="l-jour" class="view"></div>
  </main>

  <main id="v-taches" class="view" hidden>
    <div class="thead"><h1>Tâches</h1><span class="tsum" id="tsum"></span></div>
    <div class="fbar">
      <div class="chips scroll" id="chips" role="group" aria-label="Filtrer"></div>
      <button type="button" class="sortbtn" id="tsort" data-act="tmenu" aria-haspopup="menu" aria-expanded="false" aria-controls="tmenu" aria-label="Trier et ranger"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M7 12h10M10 17h4"/></svg></button>
      <div class="tmenu" id="tmenu" role="menu" aria-label="Trier et ranger" hidden></div>
    </div>
    <div id="l-tasks" class="view"></div>
  </main>

  <main id="v-objectifs" class="view" hidden>
    <h1>Objectifs</h1>
    <div id="l-goals" style="display:flex;flex-direction:column;gap:12px"></div>
    <div id="l-habits"></div>
  </main>

  <main id="v-brouillon" class="view" hidden>
    <div id="nb-list" class="view">
      <div class="nb-head"><h1>Brouillon</h1><span class="n" id="nb-count"></span></div>
      <label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><input type="search" id="nb-q" placeholder="Rechercher" aria-label="Rechercher dans les notes" autocomplete="off" enterkeyhint="search"></label>
      <div class="chips scroll" id="nb-folders" role="group" aria-label="Dossiers"></div>
      <div id="l-notes" class="view"></div>
    </div>
    <div id="nb-ed" hidden></div>
  </main>
</div>

<button type="button" class="fab" id="fab" data-act="add" aria-label="Ajouter">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
</button>

<nav class="tabs" id="nav" aria-label="Vues">
  <a href="#jour" data-tab="jour">Jour</a>
  <a href="#taches" data-tab="taches">Tâches</a>
  <a href="#objectifs" data-tab="objectifs">Objectifs</a>
  <a href="#brouillon" data-tab="brouillon">Brouillon</a>
</nav>

<button type="button" class="upd" id="upd" hidden>Nouvelle version · Mettre à jour</button>
<div class="scrim" data-act="close-sheet"></div>
<form class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-h" tabindex="-1" autocomplete="off"></form>

<label id="hap" aria-hidden="true" style="position:fixed;left:-9999px;top:0;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none"><input type="checkbox" switch tabindex="-1"></label>
<div class="toast" id="toast" role="status">
  <svg class="tk" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6.5"/></svg><span id="toast-txt"></span><button type="button" data-act="undo" id="toast-undo">Annuler</button>
</div>

<script>var APPV="2026-11-23.4";</script>
<script src="js/base.js"></script>
<script src="js/vues.js"></script>
<script src="js/brouillon.js"></script>
<script src="js/fiche.js"></script>
<script src="js/actions.js"></script>
<script src="js/sync.js"></script>
<script src="js/reglages.js"></script>
<script src="js/demarrage.js"></script>
</body>
</html>
