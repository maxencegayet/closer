<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Closer</title>
<meta name="description" content="Closer : agenda, tâches, devoirs, habitudes et objectifs dans une seule page, sans compte ni serveur.">
<meta name="theme-color" content="#eff0f2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Closer">
<link rel="preload" href="fonts/schibsted-grotesk.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Schibsted Grotesk";font-style:normal;font-display:swap;font-weight:400 900;src:url(fonts/schibsted-grotesk.woff2) format("woff2")}
/* Direction : relevé de compte. Une seule famille, noir sur blanc, un bloc noir
   qui porte le "solde" de la journée ; tout le reste se tait.
   Colonne unique alignée à gauche. On lit d'abord, on ajoute ensuite (bouton + unique, fiche d'édition).
   Thème clair unique, par choix. */
:root{
  --bg:#eff0f2; --surface:#ffffff; --ink:#000000; --muted:#676c77; --line:#ecedf0;
  --credit:#0a9a56; --late:#d7281d; --hero-off:#33353b; --hero-soft:#b3b7bf;
  --font:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --ease-drawer:cubic-bezier(0.32,0.72,0,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[hidden]{display:none!important}

.app{max-width:620px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(170px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.view{display:flex;flex-direction:column;gap:18px}
.brand{font-weight:800;font-size:19px;letter-spacing:-.015em;font-synthesis:none;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
h1{margin:0;font-weight:800;font-size:28px;line-height:1.1;letter-spacing:-.03em}

/* navigation flottante */
nav.tabs{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));margin-inline:auto;max-width:460px;z-index:5;display:flex;gap:2px;background:var(--ink);border-radius:999px;padding:5px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:1 0 auto;text-align:center;padding:12px 8px;border-radius:999px;text-decoration:none;color:var(--hero-soft);font-weight:600;font-size:14px;letter-spacing:-.01em;white-space:nowrap;transition:background-color 150ms ease,color 150ms ease,transform 160ms var(--ease-out)}
nav.tabs a[aria-current="page"]{background:var(--surface);color:var(--ink)}
nav.tabs a:active{transform:scale(.97)}
nav.tabs a:focus-visible{outline-color:var(--surface);outline-offset:-3px}
@media (max-width:379px){nav.tabs a{font-size:13px;padding:12px 6px}}

.fab{position:fixed;right:max(16px,calc(50% - 294px));bottom:calc(82px + env(safe-area-inset-bottom,0px));z-index:5;width:58px;height:58px;border-radius:50%;border:0;background:var(--ink);color:var(--surface);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.22);transition:transform 160ms var(--ease-out)}
.fab:active{transform:scale(.94)}
.fab svg{width:24px;height:24px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round}

.note{background:var(--surface);border-radius:16px;padding:12px 16px;font-size:14px}

/* le solde du jour */
.hero{background:var(--ink);color:var(--surface);border-radius:28px;padding:20px 22px 22px;display:flex;flex-direction:column;gap:16px}
.hero .date{font-size:15px;font-weight:500;color:var(--hero-soft)}
.hero .date::first-letter{text-transform:uppercase}
.hero .count{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.hero .num{font-weight:800;font-size:clamp(76px,23vw,112px);line-height:.8;letter-spacing:-.055em;font-variant-numeric:tabular-nums}
.hero .lbl{font-size:19px;font-weight:700;line-height:1.15;padding-bottom:1px}
.hero .lbl span{display:block;font-weight:500;color:var(--hero-soft)}
.hero .msg{font-weight:800;font-size:clamp(32px,9vw,46px);line-height:1;letter-spacing:-.04em;text-wrap:balance}
.hero .sub{font-size:16px;color:var(--hero-soft);margin-top:-6px}
.segs{display:flex;gap:4px;height:12px}
.segs i{flex:1;border-radius:6px;background:var(--hero-off)}
.segs i.on{background:var(--surface)}

/* les 7 prochains jours */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--surface);border-radius:20px;padding:6px}
.day{border:0;background:transparent;border-radius:14px;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;transition:background-color 150ms ease,color 150ms ease,transform 160ms var(--ease-out)}
.day:active{transform:scale(.95)}
.day .wd{font-size:12px;font-weight:500;color:var(--muted)}
.day .dn{font-size:18px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.day .ct{font-size:12px;font-weight:600;min-height:16px;color:var(--muted);font-variant-numeric:tabular-nums}
.day .ct.has{color:var(--ink)}
.day[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.day[aria-pressed="true"] .wd,.day[aria-pressed="true"] .ct{color:var(--hero-soft)}
.day[aria-pressed="true"] .ct.has{color:var(--surface)}

/* sections et lignes */
section.block{display:flex;flex-direction:column;gap:8px}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:0 8px}
h2{font-weight:600;font-size:14px;color:var(--muted);margin:0}
h2::first-letter{text-transform:uppercase}
h2.late{color:var(--late)}
.sh .n{font-size:14px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}

.list{background:var(--surface);border-radius:20px;padding:4px 0}
.row{display:flex;align-items:center;gap:12px;padding:0 0 0 16px;position:relative}
.row + .row::before{content:"";position:absolute;left:54px;right:16px;top:0;height:1px;background:var(--line)}
.check{flex:none;width:26px;height:26px;border-radius:9px;border:2px solid #b9bcc4;background:transparent;padding:0;display:grid;place-items:center;position:relative;transition:transform 140ms var(--ease-out)}
.check::after{content:"";position:absolute;inset:-10px}
.check:active{transform:scale(.9)}
.check.round{border-radius:50%}
.check[aria-checked="true"]{background:var(--credit);border-color:var(--credit)}
.check svg{width:14px;height:14px;stroke:var(--surface);stroke-width:3;fill:none;opacity:0}
.check[aria-checked="true"] svg{opacity:1}
.body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;border:0;background:transparent;text-align:left;padding:13px 16px 13px 0;border-radius:12px}
.body:focus-visible{outline-offset:-2px}
.title{font-weight:500;overflow-wrap:anywhere}
.prio .title{font-weight:700}
.done .title{color:var(--muted);text-decoration:line-through;font-weight:500}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;font-size:13.5px;color:var(--muted)}
.meta .late{color:var(--late);font-weight:600}
.meta .credit{color:var(--credit);font-weight:600}
.flag{background:var(--ink);color:var(--surface);border-radius:6px;padding:1px 7px;font-size:12px;font-weight:600}
.done .flag{background:var(--muted)}
.pips{display:inline-flex;gap:3px}
.pips i{width:16px;height:6px;border-radius:3px;background:#d9dbe1}
.pips i.on{background:var(--ink)}
.reached .pips i.on{background:var(--credit)}
.empty{padding:16px;color:var(--muted);font-size:15px}

.btn{background:var(--ink);color:var(--surface);border:0;border-radius:999px;padding:12px 20px;font-weight:700;min-height:48px;transition:transform 160ms var(--ease-out)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--surface);color:var(--ink);font-weight:600}
.btn.small{min-height:40px;padding:8px 16px;font-size:14px}
.btn.danger{background:transparent;color:var(--late);font-weight:600;padding-left:4px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:4px;margin:-4px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--surface);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap;transition:background-color 150ms ease,color 150ms ease,transform 160ms var(--ease-out)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.chip:active{transform:scale(.97)}

/* objectifs */
.goal{background:var(--surface);border-radius:24px;padding:18px 20px 20px;display:flex;flex-direction:column;gap:14px}
.goal-head{display:flex;gap:10px;align-items:flex-start;width:100%;border:0;background:transparent;text-align:left;padding:0;border-radius:10px;-webkit-user-select:none;user-select:none}
.goal-head .t{flex:1;min-width:0;padding:3px 0 0;font-weight:700;font-size:20px;line-height:1.2;letter-spacing:-.015em;overflow-wrap:anywhere}
.goal-head .chev{flex:none;width:22px;height:22px;margin-top:6px;fill:none;stroke:var(--muted);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform 220ms var(--ease-out)}
.goal.open .goal-head .chev{transform:rotate(180deg)}
.gsum{font-size:14px;color:var(--muted);margin-top:-4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gbody{display:flex;flex-direction:column;gap:14px}
.gfoot{display:flex;flex-wrap:wrap;gap:6px 20px}
.goal-head .pct{flex:none;font-weight:800;font-size:28px;line-height:1.1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.goal.reached .pct{color:var(--credit)}
.when{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.when b{background:var(--bg);color:var(--ink);border-radius:999px;padding:2px 10px;font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.when b.late{color:var(--late)}
.track{height:12px;border-radius:6px;background:var(--bg);overflow:hidden}
.fill{height:100%;width:100%;background:var(--ink);transform-origin:left center}
.goal.reached .fill{background:var(--credit)}
.steps{display:flex;flex-direction:column}
.step{display:flex;align-items:center;gap:12px}
.step .check{width:22px;height:22px;border-radius:7px}
.step .check svg{width:12px;height:12px}
.linked{display:flex;flex-direction:column;gap:2px;background:var(--bg);border-radius:14px;padding:10px 14px}
.linked h3{margin:0 0 2px;font-size:13px;font-weight:600;color:var(--muted)}
.lk{border:0;background:transparent;text-align:left;padding:5px 0;border-radius:8px;display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;font-weight:500}
.lk span{font-size:13.5px;font-weight:400;color:var(--muted)}
.lk span.credit{color:var(--credit);font-weight:600}
.steps .step + .step{border-top:1px solid var(--line)}
.step .body{flex:1;min-width:0;border:0;background:transparent;text-align:left;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;padding:11px 0}
.step .body>span:not(.title){font-size:13.5px;color:var(--muted)}
.step .body>span.late{color:var(--late);font-weight:600}
form.addstep{margin:0}
.check.ghostcheck{border-style:dashed;color:var(--muted);pointer-events:none}
.check.ghostcheck svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;opacity:1;transform:none}
form.addstep input{flex:1;min-width:0;border:0;background:transparent;outline:none;padding:11px 0;min-height:44px;font-size:16px;color:var(--ink);-webkit-appearance:none;appearance:none}
form.addstep input::placeholder{color:var(--muted)}
.addgo{flex:none;width:30px;height:30px;border-radius:50%;border:0;background:var(--ink);color:var(--surface);display:grid;place-items:center;padding:0;transition:transform 140ms var(--ease-out),opacity 140ms ease}
.addgo svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.addgo:active{transform:scale(.92)}
form.addstep input:placeholder-shown + .addgo{opacity:0;transform:scale(.6);pointer-events:none}
.goal .btn.ghost{background:var(--bg)}

/* brouillon */
/* Brouillon : liste façon Notes */
.nb-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.nb-head .n{color:var(--muted);font-size:14px;font-weight:600}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:14px;padding:0 14px;color:var(--muted)}
.search:focus-within{box-shadow:0 0 0 2px var(--ink)}
.search svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;min-height:46px;color:var(--ink);-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--muted)}
.nrow{display:flex;flex-direction:column;align-items:stretch;gap:3px;width:100%;min-width:0;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:13px 16px;transition:background-color 150ms ease}
.list .nrow:first-child{border-top:0}
.nrow:active{background:var(--bg)}
.nrow .nt{display:flex;align-items:center;gap:6px;min-width:0;font-weight:700;font-size:16px;letter-spacing:-.01em}
.nrow .nt>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nrow .np{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nrow .np b{font-weight:600;color:var(--ink);margin-right:8px}
.nrow .nf{align-self:flex-start;font-size:12px;font-weight:600;color:var(--muted);background:var(--bg);border-radius:6px;padding:2px 7px;margin-top:2px}
.pin{width:14px;height:14px;flex:none;fill:currentColor;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}
/* Brouillon : éditeur façon Notion */
body.editing #top,body.editing nav.tabs,body.editing .fab{display:none!important}
.ne-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;display:flex;align-items:center;gap:8px;margin:-8px -16px 0;padding:8px 16px;background:var(--bg)}
.ne-top .back{display:flex;align-items:center;gap:2px;background:none;border:0;padding:10px 6px 10px 0;font-weight:700;font-size:16px}
.ne-top .back svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ne-top .sp{flex:1}
.icon{width:42px;height:42px;border-radius:50%;border:0;background:var(--surface);color:var(--ink);display:grid;place-items:center;transition:background-color 150ms ease,color 150ms ease,transform 160ms var(--ease-out)}
.icon:active{transform:scale(.94)}
.icon svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.icon[aria-pressed="true"] svg{fill:currentColor}
.ne{display:flex;flex-direction:column;gap:8px;padding-bottom:110px}
.ne.enter{animation:neIn 220ms var(--ease-out)}
@keyframes neIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.ne-folders{margin-bottom:6px}
.ne-folders .chip{padding:6px 12px;font-size:13px}
.ne-title{display:block;width:100%;border:0;background:transparent;resize:none;outline:none;padding:0;overflow:hidden;font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.12}
.ne-meta{font-size:13px;color:var(--muted);margin-bottom:8px}
.ne-body{display:block;width:100%;border:0;background:transparent;resize:none;outline:none;padding:0;overflow:hidden;min-height:45vh;font-size:17px;line-height:1.55}
.ne-title::placeholder,.ne-body::placeholder{color:#a3a7b0}
mark{background:#ffe27a;color:inherit;border-radius:3px;padding:0 1px;margin:0 -1px}
mark.cur{background:#ffc21a;box-shadow:0 0 0 2px #ffc21a}
.np.hit{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ne-title.ro,.ne-body.ro{white-space:pre-wrap;overflow-wrap:anywhere;cursor:text}
.ne-title.ro .ph{color:#a3a7b0}
.nfind{position:sticky;top:calc(10px + env(safe-area-inset-top,0px));z-index:3;display:flex;align-items:center;gap:4px;background:var(--ink);color:var(--surface);border-radius:999px;padding:5px 5px 5px 16px;margin:0 0 14px;box-shadow:0 6px 18px rgba(0,0,0,.16)}
.nfind .nfq{min-width:0;flex:0 1 auto;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nfind .nfc{flex:1;white-space:nowrap;font-size:14px;color:var(--hero-soft);padding-left:8px;font-variant-numeric:tabular-nums}
.nfind .icon{width:38px;height:38px;background:transparent;color:var(--surface)}
.nfind .icon svg{fill:none;stroke:currentColor;stroke-width:2.2}
.nfind .icon:active{background:#26282d}
.nfdone{flex:none;border:0;border-radius:999px;background:var(--surface);color:var(--ink);font-weight:700;font-size:14px;padding:9px 14px;margin-left:2px}
.ne-tools{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));margin-inline:auto;max-width:460px;z-index:5;display:flex;background:var(--ink);border-radius:999px;padding:5px;transition:transform 120ms ease}
.ne-tools button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;background:transparent;color:var(--surface);font-weight:600;font-size:14px;padding:12px 10px;-webkit-user-select:none;user-select:none}
.ne-tools button:active{background:#26282d}
.ne-tools svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){.ne.enter{animation:none}}
.x{flex:none;border:0;background:transparent;color:#787d88;width:32px;height:32px;border-radius:50%;font-size:18px;line-height:1;position:relative;transition:background-color 150ms ease,color 150ms ease,transform 160ms var(--ease-out)}
.x::after{content:"";position:absolute;inset:-6px}
.x:active{transform:scale(.92);background:var(--bg);color:var(--ink)}
@media (hover:hover) and (pointer:fine){.x:hover{background:var(--bg);color:var(--ink)}}

/* fiche d'ajout et de modification */
.scrim{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.42);opacity:0;visibility:hidden;transition:opacity 220ms ease,visibility 0s 220ms}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;margin-inline:auto;max-width:620px;height:min(92%,700px);height:min(92dvh,700px);background:var(--bg);border-radius:28px 28px 0 0;padding:14px 16px calc(28px + env(safe-area-inset-bottom,0px));overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:16px;
  transform:translateY(100%);visibility:hidden;transition:transform 220ms var(--ease-out),visibility 0s 220ms}
.sheet-open .scrim{opacity:1;visibility:visible;transition:opacity 320ms ease,visibility 0s}
.sheet-open .sheet{transform:none;visibility:visible;transition:transform 340ms var(--ease-drawer),visibility 0s}
.sheet:focus{outline:none}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sh-head h2{font-size:16px;font-weight:700;color:var(--ink);text-align:center;flex:1}
.field{display:flex;flex-direction:column;gap:6px}
.field > label,.field > .lab{font-size:13px;font-weight:600;color:var(--muted);padding-left:4px}
.hint{font-size:14px;color:var(--muted);padding:0 4px;margin-top:-6px}
.sheet input[type=text],.sheet input[type=date],.sheet select{width:100%;background:var(--surface);border:0;border-radius:16px;padding:12px 16px;min-height:50px}
.sheet input::placeholder{color:var(--muted)}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:8px}
label.tick{display:flex;align-items:center;gap:10px;font-weight:500;background:var(--surface);border-radius:16px;padding:12px 16px;min-height:50px}
label.tick input{width:20px;height:20px;accent-color:var(--ink);flex:none}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tools .push{margin-left:auto}
.mvs{flex:none;display:flex;gap:6px;padding-right:12px}
.mv{width:40px;height:40px;border-radius:50%;border:0;background:var(--bg);display:grid;place-items:center;transition:transform 140ms var(--ease-out)}
.mv:active{transform:scale(.92)}
.mv[disabled]{opacity:.3;cursor:default}
.mv svg{width:16px;height:16px;stroke:var(--ink);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.catrow{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border-radius:16px;padding:6px 8px 6px 16px;font-weight:500;min-height:50px}
.catlist{display:flex;flex-direction:column;gap:6px}
.addcat{display:flex;gap:8px}
.filebtn{display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.filebtn input{position:absolute;width:1px;height:1px;opacity:0}
.filebtn:focus-within{outline:2px solid var(--ink);outline-offset:2px}
.stack{display:flex;flex-direction:column;gap:8px}
.addcat input{flex:1;min-width:0}

.toast{position:fixed;left:16px;right:16px;bottom:calc(152px + env(safe-area-inset-bottom,0px));margin-inline:auto;width:fit-content;max-width:calc(100% - 32px);z-index:6;background:var(--ink);color:var(--surface);border-radius:16px;padding:10px 10px 10px 18px;display:flex;align-items:center;gap:14px;font-size:14px;font-weight:500;
  transform:translateY(calc(100% + 170px));opacity:0;visibility:hidden;transition:transform 200ms var(--ease-out),opacity 200ms var(--ease-out),visibility 0s 200ms}
.toast.open{transform:none;opacity:1;visibility:visible;transition:transform 400ms ease,opacity 400ms ease,visibility 0s}
.toast button{background:var(--surface);color:var(--ink);border:0;border-radius:999px;padding:7px 14px;font-weight:700;transition:transform 160ms var(--ease-out)}
.toast button:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){
  .toast,.toast.open,.sheet,.sheet-open .sheet{transform:none}
  .sheet{opacity:0;transition:opacity 150ms ease,visibility 0s 150ms}
  .sheet-open .sheet{opacity:1;transition:opacity 150ms ease,visibility 0s}
  .btn:active,.chip:active,.check:active,.x:active,.day:active,.fab:active,nav.tabs a:active,.toast button:active{transform:none}
}

/* compte, synchro et mises à jour */
.sheet input[type=email],.sheet input[type=password]{width:100%;background:var(--surface);border:0;border-radius:16px;padding:12px 16px;min-height:50px}
.pwrow{position:relative}.pwrow input{padding-right:76px!important}.pwrow .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:transparent;border:0;color:var(--muted);font-weight:600;font-size:14px;padding:8px 10px;min-height:40px}
.acdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:7px;vertical-align:2px;background:var(--hero-soft)}
.acdot.ok{background:var(--credit)}.acdot.err{background:var(--late)}
.acbox{background:var(--surface);border-radius:16px;padding:14px 16px;font-size:14px;line-height:1.45}
.acbox b{font-weight:700}
.rules span{white-space:nowrap}.rules .on{color:var(--credit);font-weight:600}
.upd{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));z-index:8;background:var(--ink);color:var(--surface);border:0;border-radius:999px;padding:11px 18px;font-weight:700;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.18);white-space:nowrap}
.upd[hidden]{display:none}

/* ---- iPhone : comportement d'appli installée ---- */
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{overscroll-behavior:none}
button,a,label,[role="button"],[role="checkbox"],input[type=date],select{touch-action:manipulation}
button,[role="button"],[role="checkbox"],nav.tabs a,.chip,.fab,.brand{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select{font-size:16px}
.scrim{touch-action:none}
.sheet::before{content:"";flex:none;align-self:center;width:38px;height:5px;border-radius:3px;background:#c4c7ce;margin:-6px 0 -8px}
.sheet.dragging{transition:none!important}
.sheet-open.sheet-drag .scrim{transition:none}

/* caches : rien ne passe sous l'heure ni sous la barre d'onglets */
.edge-top,.edge-bottom{position:fixed;left:0;right:0;z-index:4;pointer-events:none}
.edge-top{top:0;height:calc(env(safe-area-inset-top,0px) + 10px);background:linear-gradient(to bottom,var(--bg) calc(100% - 10px),rgba(239,240,242,0))}
.edge-bottom{bottom:0;height:calc(96px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) calc(100% - 26px),rgba(239,240,242,0))}
/* 4. le bouton + s'efface quand on fait défiler vers le bas, revient vers le haut */
.fab{transition:transform 220ms var(--ease-out),opacity 180ms ease}
.fab.away{transform:translateY(calc(100% + 96px));opacity:0;pointer-events:none}

/* puces discrètes, liens, historique des habitudes */
.chip.quiet{background:transparent;text-decoration:underline;text-underline-offset:3px}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--muted);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.hab{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-top:1px solid var(--line)}
.hab:first-child{border-top:0}
.hab .body{padding:0;text-align:left}
.hab .grid{display:flex;gap:8px}
.hab .grid .wk{flex:1;display:flex;gap:3px}
.hab .grid i{flex:1;height:14px;border-radius:3px;background:var(--line)}
.hab .grid i.on{background:var(--ink)}
.hab .grid i.fut{opacity:.35}
.hab .grid i.now{box-shadow:inset 0 0 0 1.5px var(--ink)}

/* Réglages */
.gear{width:46px;height:46px;padding:0;border-radius:50%;display:grid;place-items:center;position:relative}
.gear svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform 300ms var(--ease-out)}
.gear:active svg{transform:rotate(45deg)}
.gear .acdot{position:absolute;top:8px;right:8px;margin:0;width:9px;height:9px;box-shadow:0 0 0 2px var(--surface)}
.gear .acdot:not(.ok):not(.err){display:none}
.sgroup{display:flex;flex-direction:column;gap:7px}
.slab{margin:0;padding:0 4px;font-size:13px;font-weight:600;color:var(--muted)}
.slist{background:var(--surface);border-radius:18px;overflow:hidden}
.srow{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:9px 14px;border:0;background:none;text-align:left;position:relative;transition:background-color 150ms ease}
.srow+.srow::before,.sdetail+.srow::before{content:"";position:absolute;top:0;left:56px;right:0;height:1px;background:var(--line)}
.srow:active{background:var(--bg)}
.si{width:30px;height:30px;border-radius:9px;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none}
.si svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.si.red{background:var(--late)}
.sl{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;font-weight:600;font-size:15px}
.sl small{font-weight:500;font-size:13px;color:var(--muted);line-height:1.3}
.sv{color:var(--muted);font-size:15px;font-weight:500}
.chev{width:16px;height:16px;flex:none;stroke:#b5b9c1;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform 200ms var(--ease-out)}
.srow[aria-expanded="true"] .chev{transform:rotate(90deg)}
.srow.danger .sl{color:var(--late)}
.sw{width:50px;height:30px;border-radius:999px;background:#d5d8de;position:relative;flex:none;transition:background-color 200ms ease}
.sw i{position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform 220ms var(--ease-out)}
.srow[aria-checked="true"] .sw{background:var(--credit)}
.srow[aria-checked="true"] .sw i{transform:translateX(20px)}
.sdetail{margin:0;padding:0 16px 14px 56px;font-size:14px;color:var(--muted);line-height:1.5}
ol.sdetail,ul.sdetail{padding-left:74px;display:flex;flex-direction:column;gap:6px}
.sdetail.news{list-style:none;padding-left:56px}
.sdetail.news b{display:block;color:var(--ink);font-size:13px}
.snote{margin:0;padding:0 4px;font-size:13px;color:var(--muted);line-height:1.45}
.prof{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:20px;padding:14px 14px 14px 16px}
.av{width:50px;height:50px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:21px;flex:none}
.prof .pi{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.prof .pe{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prof .ps{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted)}
.prof .ps .acdot{margin:0;flex:none}
.prof .icon{background:var(--bg)}
.spin{animation:spin 900ms linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--surface);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.stat b{font-size:30px;font-weight:800;letter-spacing:-.04em;line-height:1}
.stat b small{font-size:16px;color:var(--muted);letter-spacing:0}
.stat span{font-size:13px;color:var(--muted);line-height:1.3}
.stat.hl{background:var(--ink);color:var(--surface)}
.stat.hl span{color:var(--hero-soft)}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

/* brouillon repris */
.restored{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff7e0;color:#5b4300;border-radius:14px;padding:10px 14px;font-size:14px;line-height:1.35}
.restored .linkbtn{color:#5b4300;flex:none}
/* enregistrement : coche dans le message, ligne qui s'illumine */
.toast .tk{display:none;width:22px;height:22px;flex:none;stroke:var(--credit-on,#7ee2a0);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.toast.ok .tk{display:block}
.toast.ok .tk circle{stroke-dasharray:63;stroke-dashoffset:63;animation:tkC 420ms var(--ease-out) forwards}
.toast.ok .tk path{stroke-dasharray:16;stroke-dashoffset:16;animation:tkC 260ms 300ms var(--ease-out) forwards}
.toast.ok{animation:tkPop 420ms var(--ease-out);gap:10px}
.toast:has(#toast-undo[hidden]){padding-right:18px}
@keyframes tkC{to{stroke-dashoffset:0}}
@keyframes tkPop{0%{scale:.92}55%{scale:1.03}100%{scale:1}}
.flash{animation:rowFlash 1300ms ease-out}
@keyframes rowFlash{0%,25%{background-color:#e3f5e9;box-shadow:inset 3px 0 0 var(--credit)}100%{background-color:transparent;box-shadow:inset 3px 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.toast.ok,.toast.ok .tk circle,.toast.ok .tk path{animation:none;stroke-dashoffset:0}.flash{animation:none}}
</style>
</head>
<body>
<div class="edge-top" aria-hidden="true"></div><div class="edge-bottom" aria-hidden="true"></div>
<div class="app" id="app">
  <div id="top" style="display:flex;justify-content:space-between;align-items:center;gap:12px">
    <div class="brand">Closer</div>
    <button type="button" class="btn ghost gear" data-act="ac-open" id="ac-btn" aria-label="Réglages"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><i class="acdot" id="ac-dot"></i></button>
  </div>
  <div class="note" id="note" hidden></div>

  <main id="v-jour" class="view">

  <main id="v-devoirs" class="view" hidden>

    <div id="nb-list" class="view">
      <div class="nb-head"><h1>Brouillon</h1><span class="n" id="nb-count"></span></div>
      <label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><input type="search" id="nb-q" placeholder="Rechercher" aria-label="Rechercher dans les notes" autocomplete="off" enterkeyhint="search"></label>
      <div class="chips scroll" id="nb-folders" role="group" aria-label="Dossiers"></div>
      <div id="l-notes" class="view"></div>
    </div>

</div>

<button type="button" class="fab" id="fab" data-act="add" aria-label="Ajouter">

<label id="hap" aria-hidden="true" style="position:fixed;left:-9999px;top:0;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none"><input type="checkbox" switch tabindex="-1"></label>

  <svg class="tk" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6.5"/></svg><span id="toast-txt"></span><button type="button" data-act="undo" id="toast-undo">Annuler</button>
</div>

<script>
(function(){
"use strict";
var DEFAULT_CATS=["Perso","Job","Courses","Achats","RDV","Autre"];
var TABS=["jour","devoirs","taches","objectifs","brouillon"];
var MONTHS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
var CHECK='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var LS_KEY="cap-items-v1";
var KIND_NAME={task:"tâche",hw:"devoir",daily:"habitude",goal:"objectif",step:"étape"};
var KIND_NEW={task:"Nouvelle tâche",hw:"Nouveau devoir",daily:"Nouvelle habitude",goal:"Nouvel objectif"};
var KIND_HINT={
  task:"Une chose à faire une fois, avec ou sans date.",
  hw:"Un travail à rendre pour un cours, classé par matière.",
  daily:"Une habitude à tenir chaque jour, ou un certain nombre de fois par semaine.",
  goal:"Un cap sur plusieurs semaines ou mois, que tu découpes en étapes."
};

var state={items:new Map(),filter:"Tout",subj:"Tout",day:"",showDone:{taches:false,devoirs:false},arr:{taches:false,devoirs:false},mode:"loading",note:"",nfolder:"Toutes",nq:"",noteOpen:null};
var dirty={}, noteTimers={}, lastNoteIds=null;
var lastDeleted=null, toastTimer=null, focusAfter=null;
var sheet=null, opener=null, orderGroups={};
var prevPct={}, prevDone=null, curView=null, EASE="cubic-bezier(0.23,1,0.32,1)";
var reduce=window.matchMedia?window.matchMedia("(prefers-reduced-motion: reduce)"):{matches:false};

function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function cap(s){s=String(s==null?"":s);return s?s.charAt(0).toLocaleUpperCase("fr-FR")+s.slice(1):s;}
function pad(n){return n<10?"0"+n:""+n;}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function parse(s){var p=String(s).split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function today(){return iso(new Date());}
function shift(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d);}
function diffDays(a,b){return Math.round((parse(a)-parse(b))/864e5);}
function isDate(s){return typeof s==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(s);}
function fmt(s,opt){return parse(s).toLocaleDateString("fr-FR",opt||{weekday:"short",day:"numeric",month:"short"});}

/* ---------- stockage ---------- */
function newId(){
  return "l"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
}
function persistLocal(){
  if(state.mode!=="local")return;
  try{localStorage.setItem(LS_KEY,JSON.stringify(Array.from(state.items.entries())));}catch(e){}
  schedSync(1500);
}
function put(id,data){
  state.items.set(id,data);
}
function save(id,data){var isNew=!state.items.has(id);put(id,data);persistLocal();render();if(isNew&&data&&data.kind&&data.kind!=="prefs")stat1("first_item");}
function remove(id){
  clearTimeout(noteTimers[id]);delete dirty[id];
  state.items.delete(id);persistLocal();render();
}
function get(id){var d=state.items.get(id);if(!d)return null;var c=Object.assign({},d);if(Array.isArray(d.steps))c.steps=d.steps.map(function(s){return Object.assign({},s);});return c;}
function byKind(k){var out=[];state.items.forEach(function(d,id){if(d&&d.kind===k)out.push({id:id,d:d});});out.sort(function(a,b){return (a.d.created||0)-(b.d.created||0);});return out;}

/* ---------- catégories ---------- */
function cats(){var p=state.items.get("prefs");return p&&Array.isArray(p.cats)?p.cats.slice():DEFAULT_CATS.slice();}
function allCats(extra){
  var l=cats();
  byKind("task").forEach(function(x){var c=x.d.cat;if(c&&c!=="Devoir"&&l.indexOf(c)<0)l.push(c);});
  if(extra&&extra!=="Devoir"&&l.indexOf(extra)<0)l.push(extra);
  return l;
}
function prefs(){var p=state.items.get("prefs");p=p?Object.assign({},p):{};p.kind="prefs";return p;}
function setCats(l){var p=prefs();p.cats=l;save("prefs",p);}
function groupMode(v){var p=state.items.get("prefs"),g=p&&p.group&&p.group[v];return g==="group"?"group":"date";}
function cleanCat(v){var c=cap(String(v||"").trim()).slice(0,24);return (!c||c==="Tout"||c==="Devoir")?"":c;}

/* ---------- lignes ---------- */
function checkBtn(act,id,on,label,extra,cls){
  return '<button type="button" class="check '+(cls||"")+'" role="checkbox" aria-checked="'+(on?"true":"false")+'" aria-label="'+esc(label)+'" data-act="'+act+'" data-id="'+esc(id)+'"'+(extra||"")+'>'+CHECK+'</button>';
}
function dueSpan(due,done){
  if(!isDate(due))return "";
  var n=diffDays(due,today());
  if(done)return '<span>'+esc(fmt(due))+'</span>';
  if(n<0)return '<span class="late">Retard de '+(-n)+' j</span>';
  if(n===0)return '<span>Aujourd\'hui</span>';
  if(n===1)return '<span>Demain</span>';
  return '<span>'+esc(fmt(due))+'</span>';
}
function taskMeta(d,hideDate){
  var m="";
  if(d.prio)m+='<span class="flag">Important</span>';
  if(!hideDate||(isDate(d.due)&&d.due<today()&&!d.done))m+=dueSpan(d.due,d.done);
  m+='<span>'+esc(d.cat==="Devoir"?cap(d.subject||"Devoir"):(d.cat||""))+'</span>';
  return m;
}
var UP='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 10L8 5.5 12.5 10"/></svg>', DOWN='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 6L8 10.5 12.5 6"/></svg>';
function mvBtn(a,id,dir,ti){
  var ok=dir<0?a.up:a.down;
  return '<button type="button" class="mv" id="mv-'+esc(id)+(dir<0?"-u":"-d")+'" data-act="mv" data-k="'+a.v+'" data-g="'+a.g+'" data-dir="'+dir+'" data-id="'+esc(id)+'" aria-label="'+(dir<0?"Monter : ":"Descendre : ")+esc(ti)+'"'+(ok?"":" disabled")+'>'+(dir<0?UP:DOWN)+'</button>';
}
function taskRow(t,hideDate,a){
  var d=t.d,ti=cap(d.title);
  if(a)return '<div class="row'+(d.prio?" prio":"")+'" style="padding-left:16px"><div class="body" style="padding-right:8px"><span class="title">'+esc(ti)+'</span><span class="meta">'+taskMeta(d,hideDate)+'</span></div>'+
    '<span class="mvs">'+mvBtn(a,t.id,-1,ti)+mvBtn(a,t.id,1,ti)+'</span></div>';
  return '<div class="row'+(d.prio?" prio":"")+(d.done?" done":"")+'">'+
    checkBtn("task",t.id,d.done,(d.done?"Marquer non fait : ":"Marquer fait : ")+ti)+
    '<button type="button" class="body" data-act="edit" data-id="'+esc(t.id)+'" aria-label="Modifier : '+esc(ti)+'">'+
    '<span class="title">'+esc(ti)+'</span><span class="meta">'+taskMeta(d,hideDate)+'</span></button></div>';
}
function streakOf(d){var t=today();return (d.lastDone===t||d.lastDone===shift(t,-1))?(d.streak||0):0;}
function dailyRow(x){
  var on=x.d.lastDone===today(), s=streakOf(x.d), ti=cap(x.d.title);
  return '<div class="row'+(on?" done":"")+'">'+checkBtn("daily",x.id,on,(on?"Décocher : ":"Cocher : ")+ti,"","round")+
    '<button type="button" class="body" data-act="edit" data-id="'+esc(x.id)+'" aria-label="Modifier : '+esc(ti)+'">'+
    '<span class="title">'+esc(ti)+'</span>'+(s>1?'<span class="meta"><span class="credit">'+s+' jours de suite</span></span>':"")+'</button></div>';
}
function prioSort(a,b){
  if(!!a.d.prio!==!!b.d.prio)return a.d.prio?-1:1;
  return (a.d.created||0)-(b.d.created||0);
}
function dueCmp(a,b){
  var ad=isDate(a.d.due)?a.d.due:"9999",bd=isDate(b.d.due)?b.d.due:"9999";
  return ad===bd?0:(ad<bd?-1:1);
}
function plainSort(a,b){return dueCmp(a,b)||prioSort(a,b);}
// ordre choisi à la main : les tâches rangées passent avant celles qui ne le sont pas encore
function byOrd(f,fb){
  return function(a,b){
    var ka=a.d[f]!=null,kb=b.d[f]!=null;
    if(ka||kb){var va=ka?a.d[f]:1e5+(a.d.created||0),vb=kb?b.d[f]:1e5+(b.d.created||0);if(va!==vb)return va-vb;}
    return fb(a,b);
  };
}
var ordDSort=byOrd("ordD",prioSort), ordCSort=byOrd("ordC",plainSort);
function sortTasks(a,b){return dueCmp(a,b)||ordDSort(a,b);}
function weekStart(t){var d=parse(t);return shift(t,-((d.getDay()+6)%7));}
function weekCount(d){var ws=weekStart(today()),we=shift(ws,6);return (d.dones||[]).filter(function(x){return x>=ws&&x<=we;}).length;}
function weeklyRow(x){
  var d=x.d,n=weekCount(d),tg=d.target||1,on=(d.dones||[]).indexOf(today())>=0,ti=cap(d.title),pips="";
  for(var i=0;i<tg;i++)pips+='<i'+(i<n?' class="on"':"")+'></i>';
  return '<div class="row'+(n>=tg?" reached":"")+'">'+checkBtn("weekly",x.id,on,(on?"Annuler la séance d'aujourd'hui : ":"Séance faite aujourd'hui : ")+ti,"","round")+
    '<button type="button" class="body" data-act="edit" data-id="'+esc(x.id)+'" aria-label="Modifier : '+esc(ti)+'">'+
    '<span class="title">'+esc(ti)+'</span><span class="meta"><span class="pips" aria-hidden="true">'+pips+'</span><span'+(n>=tg?' class="credit"':"")+'>'+n+' sur '+tg+' cette semaine</span></span></button></div>';
}
function block(title,count,rowsHtml,cls){
  return '<section class="block"><div class="sh"><h2 class="'+(cls||"")+'">'+esc(title)+'</h2><span class="n">'+count+'</span></div><div class="list">'+rowsHtml+'</div></section>';
}

/* ---------- pastille sur l'icône (appli ajoutée à l'écran d'accueil) ---------- */
var badgeLast=-1;
function badgeOk(){return "setAppBadge" in navigator;}
function setBadge(n){
  if(!badgeOk()||n===badgeLast)return;badgeLast=n;
  if(badgeOff())n=0;
  try{(n?navigator.setAppBadge(n):navigator.clearAppBadge()).catch(function(){});}catch(e){}
}

/* ---------- Jour ---------- */
function renderJour(){
  var t=today();
  if(!state.day||state.day<t||state.day>shift(t,6))state.day=t;
  var dateTxt=new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
  var dailies=byKind("daily"), tasks=byKind("task");
  var dRest=dailies.filter(function(x){return x.d.lastDone!==t;}), dDone=dailies.filter(function(x){return x.d.lastDone===t;});
  var tRest=tasks.filter(function(x){return !x.d.done&&isDate(x.d.due)&&x.d.due<=t;}).sort(sortTasks);
  var tDone=tasks.filter(function(x){return x.d.done&&x.d.doneOn===t;});
  var rest=dRest.length+tRest.length, done=dDone.length+tDone.length, total=rest+done;

  var h='<div class="date">'+esc(dateTxt)+'</div>';
  if(state.mode==="loading"){h+='<div class="msg">Chargement</div>';}
  else if(!total){h+='<div class="msg">Rien de prévu aujourd\'hui</div><div class="sub">Touche le bouton + pour ajouter une tâche ou une habitude.</div>';}
  else{
    if(!rest)h+='<div class="msg">Journée bouclée</div><div class="sub">'+done+' sur '+total+' '+(done>1?"faites":"faite")+'.</div>';
    else h+='<div class="count"><div class="num">'+rest+'</div><div class="lbl">'+(rest>1?"restantes":"restante")+'<span>sur '+total+' aujourd\'hui</span></div></div>';
    var n=Math.min(total,40), on=Math.round(done/total*n), segs="";
    for(var i=0;i<n;i++)segs+='<i'+(i<on?' class="on"':"")+'></i>';
    h+='<div class="segs" role="img" aria-label="'+done+' sur '+total+' faites">'+segs+'</div>';
  }
  $("hero").innerHTML=h;
  if(state.mode!=="loading")setBadge(rest);
  if(prevDone!==null&&done>prevDone&&total&&total<=40&&!reduce.matches){
    var seg=$("hero").querySelectorAll(".segs i")[done-1];
    if(seg&&seg.animate)seg.animate([{transform:"scaleY(.35)",opacity:.35},{transform:"none",opacity:1}],{duration:260,easing:EASE});
  }
  if(state.mode!=="loading")prevDone=done;

  // bande des 7 jours
  var w="";
  for(var k=0;k<7;k++){
    var d=shift(t,k), c=k===0?rest:tasks.filter(function(x){return !x.d.done&&x.d.due===d;}).length;
    w+='<button type="button" class="day" data-act="day" data-id="'+d+'" aria-pressed="'+(state.day===d)+'" aria-label="'+esc(fmt(d,{weekday:"long",day:"numeric",month:"long"}))+', '+c+' à faire">'+
      '<span class="wd">'+esc(k===0?"auj.":fmt(d,{weekday:"short"}))+'</span><span class="dn">'+parse(d).getDate()+'</span><span class="ct'+(c?" has":"")+'">'+(c?c:"")+'</span></button>';
  }
  $("week").innerHTML=w;

  var html="";
  if(state.day===t){
    var wk=byKind("weekly").sort(function(a,b){return (weekCount(a.d)>=(a.d.target||1)?1:0)-(weekCount(b.d)>=(b.d.target||1)?1:0);});
    var hasHab=dRest.length||wk.length;
    if(tRest.length||!hasHab)html+=block("Reste à faire",tRest.length||"",tRest.length
      ? tRest.map(function(x){return taskRow(x,true);}).join("")
      : '<div class="empty">'+(state.mode==="loading"?"Chargement…":(total?"Tout est fait pour aujourd'hui.":"Rien pour l'instant."))+'</div>');
    if(hasHab){
      // même compte que la carte noire : les habitudes du jour ; les hebdomadaires affichent leur propre « n sur x cette semaine »
      var hLeft=dRest.length;
      html+=block("Habitudes",hLeft?hLeft+" aujourd'hui":(dailies.length?"Faites aujourd'hui":""),dRest.map(dailyRow).concat(wk.map(weeklyRow)).join(""));
    }
    var und=tasks.filter(function(x){return !x.d.done&&!isDate(x.d.due);}).sort(sortTasks);
    if(und.length)html+=block("Sans date, à caser",und.length,und.map(function(x){return taskRow(x,true);}).join(""));
    if(done)html+=block("Fait aujourd'hui",done,dDone.map(dailyRow).concat(tDone.map(function(x){return taskRow(x,true);})).join(""));
  }else{
    var day=tasks.filter(function(x){return x.d.due===state.day;}).sort(function(a,b){return (a.d.done?1:0)-(b.d.done?1:0)||sortTasks(a,b);});
    html+=block(fmt(state.day,{weekday:"long",day:"numeric",month:"long"}),day.filter(function(x){return !x.d.done;}).length||"",
      day.length?day.map(function(x){return taskRow(x,true);}).join(""):'<div class="empty">Rien de prévu ce jour-là. Touche + pour y ajouter quelque chose.</div>');
  }
  $("l-jour").innerHTML=html;
}

/* ---------- Devoirs et Tâches ---------- */
function chipsHtml(key,opts){
  return opts.map(function(c){
    return '<button type="button" class="chip" aria-pressed="'+(state[key]===c)+'" data-act="filter" data-k="'+key+'" data-id="'+esc(c)+'">'+esc(c)+'</button>';
  }).join("");
}
function subjectsList(openOnly){
  var subs=[];
  byKind("task").forEach(function(x){if(x.d.cat==="Devoir"&&(!openOnly||!x.d.done)){var s=cap(x.d.subject||"")||"Sans matière";if(subs.indexOf(s)<0)subs.push(s);}});
  return subs.sort(function(a,b){return a.localeCompare(b,"fr");});
}
function viewTasks(v){
  return byKind("task").filter(function(x){
    if(v==="devoirs")return x.d.cat==="Devoir"&&(state.subj==="Tout"||(cap(x.d.subject||"")||"Sans matière")===state.subj);
    return x.d.cat!=="Devoir"&&(state.filter==="Tout"||x.d.cat===state.filter);
  });
}
function renderTaches(){
  var cl=allCats();
  if(state.filter!=="Tout"&&cl.indexOf(state.filter)<0)state.filter="Tout";
  $("chips").innerHTML=chipsHtml("filter",["Tout"].concat(cl))+'<button type="button" class="chip quiet" data-act="cats">Gérer</button>';
  renderTaskView("taches","l-tasks","Aucune tâche en cours. Touche + pour noter la prochaine.");
}
function renderDevoirs(){
  var subs=subjectsList(true);
  if(state.subj!=="Tout"&&subs.indexOf(state.subj)<0)state.subj="Tout";
  $("chips-hw").innerHTML=subs.length>1?chipsHtml("subj",["Tout"].concat(subs)):"";
  renderTaskView("devoirs","l-hw","Aucun devoir en cours. Touche + pour noter le prochain.");
}
function renderTaskView(v,target,emptyTxt){
  var t=today(), all=viewTasks(v), mode=groupMode(v), arr=state.arr[v], isHw=v==="devoirs";
  var open=all.filter(function(x){return !x.d.done;});
  var groups=[];
  if(mode==="date"){
    open.sort(sortTasks);
    groups=[
      ["En retard","late",open.filter(function(x){return isDate(x.d.due)&&x.d.due<t;}),false],
      ["Aujourd'hui","",open.filter(function(x){return x.d.due===t;}),true],
      ["À venir","",open.filter(function(x){return isDate(x.d.due)&&x.d.due>t;}),false],
      ["Sans date","",open.filter(function(x){return !isDate(x.d.due);}),true]
    ];
  }else{
    (isHw?subjectsList(true):allCats()).forEach(function(k){
      groups.push([k,"",open.filter(function(x){return isHw?(cap(x.d.subject||"")||"Sans matière")===k:x.d.cat===k;}).sort(ordCSort),false]);
    });
  }
  groups=groups.filter(function(g){return g[2].length;});
  if(open.length<2)arr=state.arr[v]=false;
  orderGroups[v]=groups.map(function(g){return g[2].map(function(x){return x.id;});});
  var html="";
  if(open.length){
    html+='<div class="tools" role="group" aria-label="Affichage">'+
      '<button type="button" class="chip" aria-pressed="'+(mode==="date")+'" data-act="group" data-k="'+v+'" data-v="date">Par date</button>'+
      '<button type="button" class="chip" aria-pressed="'+(mode==="group")+'" data-act="group" data-k="'+v+'" data-v="group">'+(isHw?"Par matière":"Par catégorie")+'</button>'+
      (open.length>1?'<button type="button" class="chip push" id="arr-'+v+'" aria-pressed="'+!!arr+'" data-act="arr" data-k="'+v+'">'+(arr?"Terminé":"Ranger")+'</button>':"")+'</div>';
    if(arr)html+='<div class="hint" style="margin:0">'+(mode==="date"?"Par date, tu ranges entre elles les lignes d'un même jour.":"Utilise les flèches pour choisir l'ordre dans chaque groupe.")+'</div>';
  }
  groups.forEach(function(g,gi){
    html+=block(g[0],g[2].length,g[2].map(function(x,i){
      var a=null;
      if(arr){
        var pv=g[2][i-1],nx=g[2][i+1];
        a={v:v,g:gi,up:!!pv&&(mode!=="date"||dueCmp(pv,x)===0),down:!!nx&&(mode!=="date"||dueCmp(nx,x)===0)};
      }
      return taskRow(x,g[3],a);
    }).join(""),g[1]);
  });
  if(!open.length)html+='<div class="list"><div class="empty">'+(state.mode==="loading"?"Chargement…":emptyTxt)+'</div></div>';
  var done=all.filter(function(x){return x.d.done;}).sort(function(a,b){return (b.d.doneAt||0)-(a.d.doneAt||0);});
  if(done.length&&!arr){
    html+='<section class="block"><div class="sh"><h2>Terminées</h2><span class="n">'+done.length+'</span></div>'+
      (state.showDone[v]?'<div class="list">'+done.slice(0,50).map(function(x){return taskRow(x,false);}).join("")+'</div>':"")+
      '<div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn ghost small" data-act="toggle-done" data-id="'+v+'">'+(state.showDone[v]?"Masquer les terminées":"Afficher les terminées")+'</button>'+
      (state.showDone[v]?'<button type="button" class="btn ghost small" data-act="clear-done" data-id="'+v+'">Supprimer les terminées</button>':"")+'</div></section>';
  }
  $(target).innerHTML=html;
}

/* ---------- Objectifs ---------- */
// objectifs dépliés : gardés sur l'appareil
var GOALS_OPEN_KEY="closer-goals-open";
function goalsOpen(){try{var l=JSON.parse(localStorage.getItem(GOALS_OPEN_KEY)||"[]");return Array.isArray(l)?l:[];}catch(e){return [];}}
function goalOpen(id){return goalsOpen().indexOf(id)>=0;}
function setGoalOpen(id,on){var l=goalsOpen().filter(function(x){return x!==id;});if(on)l.push(id);try{localStorage.setItem(GOALS_OPEN_KEY,JSON.stringify(l));}catch(e){}}
function renderObjectifs(){
  var t=today(), goals=byKind("goal");
  if(!goals.length){$("l-goals").innerHTML='<div class="list"><div class="empty">'+(state.mode==="loading"?"Chargement…":"Aucun objectif pour l'instant. Touche + pour en créer un, puis découpe-le en étapes.")+'</div></div>';return;}
  var dailies=byKind("daily"), tasks=byKind("task");
  $("l-goals").innerHTML=goals.map(function(g){
    var d=g.d, steps=Array.isArray(d.steps)?d.steps:[], ti=cap(d.title);
    var lt=tasks.filter(function(x){return x.d.goal===g.id;}).sort(function(a,b){return (a.d.done?1:0)-(b.d.done?1:0)||sortTasks(a,b);});
    // une seule liste : les étapes puis les tâches reliées ; toutes comptent dans l'avancée
    var tot=steps.length+lt.length, nd=steps.filter(function(s){return s.done;}).length+lt.filter(function(x){return x.d.done;}).length;
    var pct=d.reached?100:(tot?Math.round(nd/tot*100):0);
    var when="";
    if(isDate(d.target)){
      var n=diffDays(d.target,t);
      when='<div class="when">D\'ici '+esc(fmt(d.target,{month:"long",year:"numeric"}))+
        (d.reached?"":(n>=0?'<b>J-'+n+'</b>':'<b class="late">Dépassé de '+(-n)+' j</b>'))+'</div>';
    }
    var rows=steps.map(function(s,i){
      var st=cap(s.t);
      return {done:!!s.done,t:st,h:'<div class="step'+(s.done?" done":"")+'">'+checkBtn("step",g.id,s.done,(s.done?"Décocher : ":"Cocher : ")+st,' data-i="'+i+'"')+
        '<button type="button" class="body" data-act="edit-step" data-id="'+esc(g.id)+'" data-i="'+i+'" aria-label="Modifier : '+esc(st)+'"><span class="title">'+esc(st)+'</span></button></div>'};
    }).concat(lt.map(function(x){
      var st=cap(x.d.title);
      return {done:!!x.d.done,t:st,h:'<div class="step'+(x.d.done?" done":"")+'">'+checkBtn("task",x.id,x.d.done,(x.d.done?"Décocher : ":"Cocher : ")+st)+
        '<button type="button" class="body" data-act="edit" data-id="'+esc(x.id)+'" aria-label="Modifier : '+esc(st)+'"><span class="title">'+esc(st)+'</span>'+(isDate(x.d.due)&&!x.d.done?dueSpan(x.d.due,false):"")+'</button></div>'};
    }));
    // ce qui reste à faire d'abord, ce qui est fait en bas (ordre conservé dans chaque groupe)
    rows=rows.filter(function(r){return !r.done;}).concat(rows.filter(function(r){return r.done;}));
    var lk=dailies.filter(function(x){return x.d.goal===g.id;}).map(function(x){
      var s=streakOf(x.d);
      return '<button type="button" class="lk" data-act="edit" data-id="'+esc(x.id)+'">'+esc(cap(x.d.title))+'<span>Chaque jour</span>'+(s>1?'<span class="credit">'+s+' jours de suite</span>':"")+'</button>';
    }).concat(byKind("weekly").filter(function(x){return x.d.goal===g.id;}).map(function(x){
      return '<button type="button" class="lk" data-act="edit" data-id="'+esc(x.id)+'">'+esc(cap(x.d.title))+'<span>'+weekCount(x.d)+' sur '+(x.d.target||1)+' cette semaine</span></button>';
    }));
    var open=goalOpen(g.id), left=tot-nd, nxt=rows.length&&left?rows[0].t:"";
    var sum=d.reached?"Objectif atteint":!tot?"Aucune tâche pour l'instant":!left?"Tout est fait":nd+" sur "+tot+" fait"+(nd>1?"s":"")+(nxt?" · Ensuite : "+nxt:"");
    return '<article class="goal'+(d.reached?" reached":"")+(open?" open":"")+'">'+
      '<button type="button" class="goal-head" data-act="goal-fold" data-id="'+esc(g.id)+'" aria-expanded="'+open+'" aria-controls="gb-'+esc(g.id)+'">'+
        '<span class="t">'+esc(ti)+'</span><span class="pct">'+pct+' %</span>'+
        '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>'+
      when+
      '<div class="track"><div class="fill" data-gid="'+esc(g.id)+'" data-p="'+pct+'" style="transform:scaleX('+(pct/100)+')"></div></div>'+
      (open?"":'<div class="gsum">'+esc(sum)+'</div>')+
      '<div class="gbody" id="gb-'+esc(g.id)+'"'+(open?"":" hidden")+'>'+
      '<div class="steps">'+rows.map(function(r){return r.h;}).join("")+
        '<form class="addstep step" data-goal="'+esc(g.id)+'"><span class="check ghostcheck" aria-hidden="true"><svg viewBox="0 0 12 12"><path d="M6 2v8M2 6h8"/></svg></span>'+
        '<input type="text" id="step-in-'+esc(g.id)+'" placeholder="Ajouter une tâche" aria-label="Nouvelle tâche pour '+esc(ti)+'" maxlength="200" autocapitalize="sentences" enterkeyhint="done">'+
        '<button class="addgo" type="submit" aria-label="Ajouter"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></svg></button></form>'+
      '</div>'+
      (lk.length?'<div class="linked"><h3>Habitudes qui le font avancer</h3>'+lk.join("")+'</div>':"")+
      '<div class="gfoot"><button type="button" class="linkbtn" data-act="edit" data-id="'+esc(g.id)+'">Modifier l\'objectif</button><button type="button" class="linkbtn" data-act="reach" data-id="'+esc(g.id)+'">'+(d.reached?"Rouvrir l'objectif":"Marquer comme atteint")+'</button></div>'+
      '</div>'+
      '</article>';
  }).join("");
}

/* ---------- Habitudes : 4 dernières semaines ---------- */
function histOf(d){
  var l=(d.dones||[]).slice();
  // anciennes habitudes sans historique : on reconstitue la série en cours
  if(d.kind==="daily"&&isDate(d.lastDone)){for(var i=0;i<(d.streak||1);i++){var x=shift(d.lastDone,-i);if(l.indexOf(x)<0)l.push(x);}}
  return l;
}
function renderHabits(){
  var hs=byKind("daily").concat(byKind("weekly")), el=$("l-habits");
  if(!hs.length){el.innerHTML="";return;}
  var t=today(), ws=weekStart(t), first=shift(ws,-21);
  el.innerHTML='<section class="block"><div class="sh"><h2>Habitudes</h2><span class="n">4 dernières semaines</span></div><div class="list">'+hs.map(function(x){
    var d=x.d, h=histOf(d), cells="", n=0;
    for(var i=0;i<28;i++){var day=shift(first,i), on=h.indexOf(day)>=0, fut=day>t;if(on&&!fut)n++;
      if(i%7===0)cells+=(i?'</span>':'')+'<span class="wk">';
      cells+='<i class="'+(on?"on":"")+(fut?" fut":"")+(day===t?" now":"")+'"></i>';}
    cells+='</span>';
    var meta=d.kind==="daily"
      ? (streakOf(d)>1?'<span class="credit">'+streakOf(d)+' jours de suite</span>':'<span>Chaque jour</span>')+'<span>'+n+' jours sur 28</span>'
      : '<span>'+(d.target||1)+' fois par semaine</span><span>'+weekCount(d)+' sur '+(d.target||1)+' cette semaine</span>';
    return '<div class="hab"><button type="button" class="body" data-act="edit" data-id="'+esc(x.id)+'" aria-label="Modifier : '+esc(cap(d.title))+'"><span class="title">'+esc(cap(d.title))+'</span><span class="meta">'+meta+'</span></button>'+
      '<div class="grid" role="img" aria-label="'+n+' fois sur les 4 dernières semaines">'+cells+'</div></div>';
  }).join("")+'</div></section>';
}
function animateFills(){
  document.querySelectorAll(".fill[data-gid]").forEach(function(el){
    var id=el.dataset.gid,p=+el.dataset.p,o=prevPct[id];prevPct[id]=p;
    if(o===undefined||o===p||reduce.matches||!el.animate)return;
    el.animate([{transform:"scaleX("+(o/100)+")"},{transform:"scaleX("+(p/100)+")"}],{duration:250,easing:EASE});
  });
}

/* ---------- Brouillon : liste façon Notes, éditeur façon Notion ---------- */

/* recherche : surlignage sans tenir compte des accents ni des majuscules */
function hlRanges(text,q){

function saveSheet(){
  if(sheet.kind==="backup")return;

  if(sheet.kind==="nfolders"){
    var fe=$("sh-nfname"), fn=cleanFolder(fe.value);

    if(sheet.forNote){var fd=get(sheet.forNote);if(fd){fd.folder=fn;save(sheet.forNote,fd);}closeSheet();return;}
    renderSheet();$("sh-nfname").focus();return;
  }
  if(sheet.kind==="cats"){
    var ce=$("sh-catname"), cn=cleanCat(ce.value);
    if(!cn){ce.focus();return;}
    var cl=cats();if(cl.indexOf(cn)<0){cl.push(cn);setCats(cl);}
    renderSheet();$("sh-catname").focus();return;
  }

    var l2=cats();if(l2.indexOf(nc)<0){l2.push(nc);setCats(l2);}
    dr.cat=nc;dr.newCat=false;
  }

  if(s.mode==="new"){
    var data;
    if(k==="task")data={kind:"task",title:title,cat:dr.cat,due:dr.due||"",prio:!!dr.prio,done:false,goal:dr.goal||"",created:now};
    else if(k==="hw")data={kind:"task",title:title,cat:"Devoir",subject:cap(dr.subject.trim()),due:dr.due||"",prio:!!dr.prio,done:false,goal:dr.goal||"",created:now};
    else if(k==="daily")data=dr.freq>0?{kind:"weekly",title:title,target:dr.freq,dones:[],goal:dr.goal||"",created:now}:{kind:"daily",title:title,lastDone:"",streak:0,goal:dr.goal||"",created:now};
    else data={kind:"goal",title:title,target:target,steps:[],reached:false,created:now};
    s.saved=true;dropDraft();
    var nid=newId();if(k==="goal")setGoalOpen(nid,true);closeSheet();save(nid,data);
    var what={task:"Tâche ajoutée",hw:"Devoir ajouté",daily:"Habitude ajoutée",goal:"Objectif ajouté"}[k]||"Ajouté";
    savedFx(nid,s.fromNote?what+" : « "+(title.length>28?title.slice(0,28)+"…":title)+" »":what);
    return;
  }
  var d=get(s.id);if(!d){closeSheet();return;}
  if(k==="step"){if(d.steps&&d.steps[s.i])d.steps[s.i].t=title;}

    if(k==="daily"){

      else if(d.kind==="weekly"){d.kind="daily";d.lastDone="";d.streak=0;}
    }
    if(k==="goal")d.target=target;
  }
  s.saved=true;closeSheet();save(s.id,d);savedFx(s.id,"Modifications enregistrées");
}

function chime(){
  try{
    if(navigator.audioSession)navigator.audioSession.type="ambient"; /* iPhone : respecte le mode silencieux */
    var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    if(!actx)actx=new AC();if(actx.state==="suspended")actx.resume();
    var t0=actx.currentTime+0.01;

      var o=actx.createOscillator(),g=actx.createGain();

      o.connect(g);g.connect(actx.destination);o.start(t0+n[1]);o.stop(t0+n[1]+0.25);
    });
  }catch(e){}
}

      '<button type="button" class="icon" data-act="ac-sync" aria-label="Synchroniser maintenant"><svg viewBox="0 0 24 24" aria-hidden="true" class="'+(cst===3?"spin":"")+'">'+IC.sync+'</svg></button></div>';
  }else if(AS.step==="signup"){
    h+='<section class="sgroup"><h3 class="slab">Créer un compte</h3><p class="snote" style="margin:0 0 4px">Tu recevras un e-mail pour confirmer ton adresse.</p>'+emField()+pwField("new-password","8 caractères minimum",1)+
      '<div class="stack"><button type="submit" class="btn">Créer mon compte</button><button type="button" class="btn ghost" data-act="ac-tologin">J\'ai déjà un compte</button></div></section>';
  }else{
    h+='<section class="sgroup"><h3 class="slab">Compte</h3><p class="snote" style="margin:0 0 4px">Facultatif : connecte-toi pour retrouver tes éléments sur tous tes appareils. Sans compte, ils restent sur cet appareil.</p>'+emField()+pwField("current-password","Mot de passe")+
      '<div class="stack"><button type="submit" class="btn">Se connecter</button><button type="button" class="btn ghost" data-act="ac-tosignup">Créer un compte</button><button type="button" class="btn ghost" data-act="ac-forgot">Mot de passe oublié ?</button></div></section>';
  }
  if(AS.msg)h+='<div class="acbox" role="status">'+esc(AS.msg)+'</div>';
  if(AS.unconf&&!SU)h+='<div><button type="button" class="btn ghost small" data-act="ac-resend">Renvoyer l\'e-mail de confirmation</button></div>';

  /* 2. Statistiques */
  var S=myStats();
  h+='<section class="sgroup"><h3 class="slab">Tes statistiques</h3><div class="stats">'+
    '<div class="stat hl"><b>'+S.done+'</b><span>'+(S.done>1?"tâches faites":"tâche faite")+' en '+esc(S.month)+'</span></div>'+
    '<div class="stat"><b>'+(S.best||"–")+'</b><span>'+(S.best>1?"jours d'affilée, ta meilleure série":"meilleure série d'habitude")+'</span></div>'+
    '<div class="stat"><b>'+S.goalsOk+'<small> / '+S.goals+'</small></b><span>objectifs atteints</span></div>'+
    '<div class="stat"><b>'+S.seances+'</b><span>'+(S.seances>1?"séances":"séance")+' cette semaine</span></div>'+
    '</div></section>';

  /* 3. Préférences */
  var perm=("Notification" in window)?Notification.permission:"", rows="";
  rows+=sRow("set-cats","tag","Catégories de tâches",{val:cats().length});
  rows+=sRow("set-folders","folder","Dossiers du Brouillon",{val:nFolders().length});
  if(badgeOk())rows+=perm==="denied"?sRow("set-badge","badge","Pastille sur l'icône",{sub:"Refusée : réactive les notifications de Closer dans les réglages du téléphone",noChev:true}):sRow("set-badge","badge","Pastille sur l'icône",{sub:"Le nombre de choses restantes sur l'icône",sw:perm==="granted"&&!badgeOff()});
  rows+=sRow("set-fx","fx","Son et vibration",{sub:"Quand tu enregistres une tâche",sw:!fxOff()});
  if(acOn())rows+=sRow("ac-stats","chart","Statistiques anonymes",{sub:statsOff()?"désactivées":"activées · aucun contenu envoyé",sw:!statsOff()});
  h+=sGroup("Préférences",rows);

  /* 4. Écran d'accueil */
  if(!standalone()){
    var steps=isIOS()?["Touche le bouton Partager de Safari (le carré avec une flèche vers le haut).","Fais défiler et choisis « Sur l'écran d'accueil ».","Touche « Ajouter » : Closer s'ouvre alors comme une vraie appli, en plein écran."]
      :["Safari sur Mac : menu Fichier › « Ajouter au Dock ».","Chrome ou Edge : menu ⋮ › « Installer Closer » (ou l'icône dans la barre d'adresse).","Closer s'ouvre alors dans sa propre fenêtre."];
    h+=sGroup("",sRow("set-a2hs","home","Ajouter Closer à l'écran d'accueil",{sub:"Plein écran, pastille sur l'icône",exp:!!setOpen.a2hs})+
      (setOpen.a2hs?'<ol class="sdetail">'+steps.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ol>':""));
  }

  /* 5. Mes données */
  h+=sGroup("Mes données",sRow("backup","data","Exporter ou importer une sauvegarde",{sub:state.items.size+(state.items.size>1?" éléments":" élément")+(SU?" · synchronisés sur ton compte":" · sur cet appareil")}));

  /* 6. Sécurité */
  if(acOn()&&SB&&SU&&AS.step!=="newpw"){
    h+=sGroup("Sécurité",sRow("ac-chpw","key","Changer de mot de passe")+sRow("ac-out","out","Se déconnecter",{sub:"Tes éléments restent sur cet appareil",noChev:true})+
      sRow("ac-del","trash",acq?"Confirmer : supprimer le compte et ses données en ligne":"Supprimer mon compte",{danger:true,noChev:true}),
      acq?"Touche encore pour confirmer. Les éléments déjà sur cet appareil y restent.":"");
  }

  /* 7. À propos */
  rows=sRow("set-news","news","Quoi de neuf",{exp:!!setOpen.news,sub:"Les dernières nouveautés de Closer"});
  if(setOpen.news)rows+='<ul class="sdetail news">'+NEWS.map(function(n){return '<li><b>'+esc(n[0])+'</b>'+esc(n[1])+'</li>';}).join("")+'</ul>';
  if(CONTACT)rows+=sRow("ac-avis","mail","Donner mon avis",{sub:"Un e-mail prérempli"});
  if(acOn()){rows+=sRow("ac-priv","shield","Confidentialité",{exp:showPriv});
    if(showPriv)rows+='<div class="sdetail"><b>Sans compte</b>, tout reste sur ton appareil.<br><br><b>Avec un compte</b>, sont stockés en ligne : ton adresse e-mail et tes éléments (tâches, devoirs, habitudes, objectifs, notes). Hébergement : Supabase (Europe).<br><br><b>Utilisation</b> : uniquement pour te connecter et synchroniser tes appareils. Pas de publicité, pas de revente.<br><br><b>Accès</b> : chaque compte ne peut lire que ses propres données.<br><br><b>Statistiques anonymes</b> : un identifiant tiré au hasard sur l\'appareil, sans lien avec ton compte ni ton contenu, et seulement 4 événements (ouverture du jour, premier élément, journée active, compte créé). Désactivables ci-dessus.</div>';}
  h+=sGroup("À propos",rows);
  h+='<p class="snote" style="text-align:center">Closer · version '+APPV+'</p>';
  return h;
}
function acRefresh(){
  var dot=$("ac-dot");if(dot)dot.className="acdot"+(SU&&cst===1?" ok":SU&&cst===2?" err":"");
  if(sheet&&sheet.kind==="account"){var a=document.activeElement;if(!(a&&(a.id==="ac-em"||a.id==="ac-pw")))renderSheet();}
}
function acOpen(b){if(sheet&&sheet.kind==="account"){renderSheet();return;}acq=false;if(sheet){sheet={mode:"edit",kind:"account",draft:{}};renderSheet();$("sheet").scrollTop=0;$("sheet").focus();return;}openSheet({mode:"edit",kind:"account",draft:{}},b||$("ac-btn"));}
function acVals(){var e=$("ac-em"),p=$("ac-pw");if(e)AS.email=e.value.trim();return {em:AS.email,pw:p?p.value:""};}
function okEm(x){return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x);}
function redir(){return location.origin+location.pathname;}
function busy(t){var b=$("sheet").querySelector('[type=submit]');if(b){b.disabled=true;b.textContent=t;}}
async function acPrimary(){
  if(!SB)return;
  var v=acVals();AS.msg="";
  try{
    if(SU&&AS.step==="newpw"){
      if(!pwOk(v.pw)){AS.msg=WEAK;return renderSheet();}
      busy("Enregistrement…");var u=await SB.auth.updateUser({password:v.pw});
      if(u.error)AS.msg=errMsg(u.error);else{AS={step:"login",email:"",msg:"Mot de passe modifié."};}
    }else if(!SU&&AS.step==="signup"){
      if(!okEm(v.em)){AS.msg="Adresse e-mail invalide.";return renderSheet();}
      if(!pwOk(v.pw)){AS.msg=WEAK;return renderSheet();}
      busy("Création…");var s=await SB.auth.signUp({email:v.em,password:v.pw,options:{emailRedirectTo:redir()}});
      if(s.error)AS.msg=errMsg(s.error);
      else if(s.data&&s.data.user&&s.data.user.identities&&!s.data.user.identities.length)AS={step:"login",email:v.em,msg:"Un compte existe déjà avec cette adresse : connecte-toi."};
      else if(s.data&&s.data.session){AS={step:"login",email:"",msg:""};stat1("signup");}
      else{AS={step:"login",email:v.em,msg:"Compte créé ! Clique sur le lien de confirmation reçu par e-mail (il arrive de « Closer », regarde aussi les spams), puis connecte-toi ici."};stat1("signup");}
    }else if(!SU){
      if(!okEm(v.em)){AS.msg="Adresse e-mail invalide.";return renderSheet();}
      if(!v.pw){AS.msg="Entre ton mot de passe.";return renderSheet();}
      busy("Connexion…");var l=await SB.auth.signInWithPassword({email:v.em,password:v.pw});
      if(l.error){AS.msg=errMsg(l.error);AS.unconf=String(l.error.message||"").toLowerCase().indexOf("not confirmed")>=0;}
      else AS={step:"login",email:"",msg:""};
    }
  }catch(e){AS.msg=errMsg(e);}
  renderSheet();
}
async function acAct(act,b){
  if(act==="ac-open"){acOpen(b);return;}
  if(act==="ac-eye"){var i=$("ac-pw");if(i){i.type=i.type==="password"?"text":"password";b.textContent=i.type==="password"?"Voir":"Cacher";i.focus();}return;}
  if(act==="ac-priv"){showPriv=!showPriv;acVals();renderSheet();return;}
  if(act==="ac-stats"){try{if(statsOff())localStorage.removeItem("closer-stats-off");else localStorage.setItem("closer-stats-off","1");}catch(e){}acVals();renderSheet();return;}
  if(act==="ac-avis"){location.href="mailto:"+CONTACT+"?subject="+encodeURIComponent("Mon avis sur Closer")+"&body="+encodeURIComponent("Ce qui me plaît :\n\nCe qui me gêne :\n\nCe que j'aimerais :\n\n— Version "+APPV);return;}
  if(!SB)return;
  acVals();AS.msg="";
  if(act==="ac-tosignup"){AS.step="signup";AS.unconf=false;renderSheet();return;}
  if(act==="ac-tologin"||act==="ac-back"){AS.step="login";renderSheet();return;}
  if(act==="ac-chpw"){AS.step="newpw";renderSheet();return;}
  if(act==="ac-sync"){syncNow();return;}
  try{
    if(act==="ac-forgot"){
      if(!okEm(AS.email)){AS.msg="Entre d'abord ton adresse e-mail.";return renderSheet();}
      var f=await SB.auth.resetPasswordForEmail(AS.email,{redirectTo:redir()});
      AS.msg=f.error?errMsg(f.error):"Si un compte existe, un e-mail vient d'être envoyé. Ouvre le lien qu'il contient pour choisir un nouveau mot de passe.";
    }else if(act==="ac-resend"){
      var rs=await SB.auth.resend({type:"signup",email:AS.email,options:{emailRedirectTo:redir()}});
      AS.msg=rs.error?errMsg(rs.error):"E-mail de confirmation renvoyé (regarde aussi les spams).";AS.unconf=!!rs.error;
    }else if(act==="ac-out"){
      if(syncTimer){clearTimeout(syncTimer);syncTimer=null;await syncNow();}
      try{await SB.auth.signOut({scope:"local"});}catch(e){}
      SU=null;cst=0;SY={};try{localStorage.removeItem(SK);}catch(e){}
      AS={step:"login",email:"",msg:"Déconnecté : tes éléments restent sur cet appareil."};
    }else if(act==="ac-del"){
      if(!acq){acq=true;return renderSheet();}
      acq=false;var d=await SB.rpc("delete_my_account");
      if(d.error){AS.msg=errMsg(d.error);return renderSheet();}
      try{await SB.auth.signOut({scope:"local"});}catch(e){}
      SU=null;cst=0;SY={};try{localStorage.removeItem(SK);}catch(e){}
      AS={step:"login",email:"",msg:"Compte supprimé. Tes éléments restent sur cet appareil."};
    }
  }catch(e){AS.msg=errMsg(e);}
  renderSheet();acRefresh();
}
document.addEventListener("input",function(ev){var t=ev.target;if(t&&t.id==="ac-pw"&&t.dataset.neu){var r=$("ac-rules");if(r)r.innerHTML=pwHint(t.value);}});

/* ---------- statistiques anonymes ---------- */
function statsOff(){try{return localStorage.getItem("closer-stats-off")==="1";}catch(e){return true;}}
function aid(){try{var a=localStorage.getItem("closer-aid");if(!a){a=(crypto.randomUUID?crypto.randomUUID():"10000000-1000-4000-8000-100000000000".replace(/[018]/g,function(c){return (c^Math.random()*16>>c/4).toString(16);}));localStorage.setItem("closer-aid",a);}return a;}catch(e){return null;}}
function stat(ev){
  if(!acOn()||statsOff()||window.__CLOSER_NOSTATS)return;
  var a=aid();if(!a)return;
  try{fetch(SB_URL+"/rest/v1/closer_events",{method:"POST",keepalive:true,headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify([{aid:a,ev:ev,d:today(),v:APPV}])}).catch(function(){});}catch(e){}
}
function stat1(ev){try{if(localStorage.getItem("closer-ev-"+ev))return;localStorage.setItem("closer-ev-"+ev,"1");}catch(e){return;}stat(ev);}
function stat1Day(ev){var k="closer-ev-"+ev+"-day",t=today();try{if(localStorage.getItem(k)===t)return;localStorage.setItem(k,t);}catch(e){return;}stat(ev);}
function statDay(ev){stat1Day(ev);}

/* ---------- fiche : glisser vers le bas pour fermer, comme sur iOS ---------- */
(function(){
  var sh=$("sheet"), sc=document.querySelector(".scrim");
  var ys=0, y0=0, t0=0, dy=0, drag=false, armed=false;
  function noDrag(t){return !!(t&&t.closest&&t.closest("input,textarea,select,[contenteditable]"));}
  function begin(y){drag=true;y0=y;t0=Date.now();dy=0;sh.classList.add("dragging");document.body.classList.add("sheet-drag");}
  function move(y){
    dy=y-y0;
    var d=dy<0?-Math.pow(-dy,0.7):dy;                       /* frottement si on tire vers le haut */
    sh.style.transform="translateY("+d+"px)";
    sc.style.opacity=String(Math.max(0,1-Math.max(0,dy)/((sh.offsetHeight||600)*1.2)));
  }
  function end(){
    if(!drag)return;drag=false;armed=false;
    var dt=Math.max(1,Date.now()-t0), v=dy/dt;
    sh.classList.remove("dragging");document.body.classList.remove("sheet-drag");sc.style.opacity="";
    if(dy>0&&(dy>(sh.offsetHeight||600)*0.28||v>0.11)){closeSheet();}  /* un geste rapide suffit */
    sh.style.transform="";
  }
  sh.addEventListener("touchstart",function(e){
    if(!sheet||e.touches.length!==1||noDrag(e.target)){armed=false;return;}
    armed=sh.scrollTop<=0;ys=e.touches[0].clientY;
  },{passive:true});
  sh.addEventListener("touchmove",function(e){
    if(!sheet||!armed)return;
    if(e.touches.length!==1){end();return;}               /* un deuxième doigt : on ne suit pas */
    var y=e.touches[0].clientY;
    if(!drag){ if(y-ys>6&&sh.scrollTop<=0){begin(y);} else if(ys-y>6){armed=false;return;} else return; }
    e.preventDefault();move(y);
  },{passive:false});
  sh.addEventListener("touchend",end);
  sh.addEventListener("touchcancel",end);
})();

route();render();
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(function(){});}
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(function(){});}
localMode();
})();
